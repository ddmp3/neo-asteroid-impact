<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="asteroid-grad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Glow effect -->
  <circle cx="50" cy="50" r="48" fill="url(#glow)" opacity="0.3"/>

  <!-- Main asteroid body -->
  <circle cx="50" cy="50" r="42" fill="url(#asteroid-grad)" stroke="#654321" stroke-width="2"/>

  <!-- Craters (impact marks) -->
  <circle cx="32" cy="35" r="7" fill="#654321" opacity="0.7"/>
  <circle cx="65" cy="38" r="5" fill="#654321" opacity="0.6"/>
  <circle cx="45" cy="62" r="9" fill="#654321" opacity="0.8"/>
  <circle cx="68" cy="65" r="4" fill="#654321" opacity="0.5"/>
  <circle cx="38" cy="55" r="3" fill="#654321" opacity="0.6"/>

  <!-- Small surface details -->
  <circle cx="55" cy="48" r="2" fill="#8B4513" opacity="0.8"/>
  <circle cx="42" cy="42" r="1.5" fill="#8B4513" opacity="0.7"/>

  <!-- Impact trajectory hint (small motion streak) -->
  <path d="M 85 15 Q 90 10, 95 5" stroke="#FF6347" stroke-width="2" opacity="0.5" fill="none"/>
  <circle cx="85" cy="15" r="1.5" fill="#FF6347" opacity="0.8"/>
</svg>
